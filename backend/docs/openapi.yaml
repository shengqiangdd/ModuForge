  /projects/{id}/sign:
    post:
      tags: [Security]
      summary: Sign module
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Module signed }

  # ─── Backup ───
  /backup/export:
    post:
      tags: [Backup]
      summary: Export database
      security:
        - BearerAuth: []
      responses:
        "200": { description: Database exported }

  /backup/import:
    post:
      tags: [Backup]
      summary: Import database
      security:
        - BearerAuth: []
      responses:
        "200": { description: Database imported }

  # ─── Notifications ───
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      security:
        - BearerAuth: []
      responses:
        "200": { description: Notification list }

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread count
      security:
        - BearerAuth: []
      responses:
        "200": { description: Unread count }

  # ─── Plugins ───
  /plugins:
    get:
      tags: [Plugins]
      summary: List plugins
      responses:
        "200": { description: Plugin list }

  /plugins/install:
    post:
      tags: [Plugins]
      summary: Install plugin
      security:
        - BearerAuth: []
      responses:
        "200": { description: Plugin installed }

  # ─── Settings ───
  /settings/agent:
    get:
      tags: [Settings]
      summary: Get agent settings
      security:
        - BearerAuth: []
      responses:
        "200": { description: Agent settings }
    put:
      tags: [Settings]
      summary: Update agent settings
      security:
        - BearerAuth: []
      responses:
        "200": { description: Settings updated }

  # ─── Search ───
  /search:
    get:
      tags: [Search]
      summary: Search projects
      security:
        - BearerAuth: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200": { description: Search results }

  # ─── Health ───
  /health/system:
    get:
      tags: [Health]
      summary: System health check
      responses:
        "200": { description: Health status }

  # ─── Admin ───
  /admin/email-config:
    get:
      tags: [Admin]
      summary: Get email config
      security:
        - BearerAuth: []
      responses:
        "200": { description: Email config }

  /admin/health/detailed:
    get:
      tags: [Admin]
      summary: Detailed health check
      security:
        - BearerAuth: []
      responses:
        "200": { description: Detailed health }

  /admin/logs:
    get:
      tags: [Admin]
      summary: List logs
      security:
        - BearerAuth: []
      responses:
        "200": { description: Log list }

  # ─── Feature Flags ───
  /admin/feature-flags:
    get:
      tags: [Admin]
      summary: List all feature flags
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Map of feature flag keys to their enabled status
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    key: { type: string }
                    enabled: { type: boolean }
                    updated_at: { type: string, format: date-time }
                    updated_by: { type: string }

  /admin/feature-flags/{key}:
    put:
      tags: [Admin]
      summary: Update a single feature flag
      security:
        - BearerAuth: []
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, description: "Feature flag key" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: Feature flag updated }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/feature-flags/batch:
    post:
      tags: [Admin]
      summary: Batch update feature flags
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flags]
              properties:
                flags:
                  type: array
                  items:
                    type: object
                    required: [key, enabled]
                    properties:
                      key: { type: string }
                      enabled: { type: boolean }
      responses:
        "200":
          description: Batch update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                  status: { type: string }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT token from /auth/login or API key via X-API-Key header"

  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }

    Error:
      type: object
      properties:
        error: { type: string }

    FeatureFlag:
      type: object
      properties:
        key: { type: string }
        description: { type: string }
        enabled: { type: boolean }

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
