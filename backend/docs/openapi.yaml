openapi: 3.0.3
info:
  title: ModuForge API
  description: |
    ModuForge - Android Kernel Module (KernelSU/APatch) Code Generation Platform.
    Go backend + WebUI with AI Agent, ADB integration, build system, and module marketplace.
  version: "2.0.0"
  contact:
    name: ModuForge
servers:
  - url: /api/v1
    description: API v1

security:
  - BearerAuth: []

paths:
  # ─── Auth (Public) ───
  /auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, email]
              properties:
                username: { type: string }
                password: { type: string }
                email: { type: string, format: email }
      responses:
        "201": { description: Registered }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh JWT token
      responses:
        "200": { description: Token refreshed }

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
      responses:
        "200": { description: Email verified }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Reset email sent }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "200": { description: Password reset }

  # ─── Auth (Protected) ───
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password: { type: string }
                new_password: { type: string }
      responses:
        "200": { description: Password changed }

  /auth/2fa/setup:
    post:
      tags: [Auth]
      summary: Setup 2FA
      security:
        - BearerAuth: []
      responses:
        "200": { description: 2FA setup data }

  /auth/2fa/enable:
    post:
      tags: [Auth]
      summary: Enable 2FA
      security:
        - BearerAuth: []
      responses:
        "200": { description: 2FA enabled }

  /auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Disable 2FA
      security:
        - BearerAuth: []
      responses:
        "200": { description: 2FA disabled }

  /auth/profile:
    get:
      tags: [Auth]
      summary: Get user profile
      security:
        - BearerAuth: []
      responses:
        "200": { description: User profile }
    put:
      tags: [Auth]
      summary: Update user profile
      security:
        - BearerAuth: []
      responses:
        "200": { description: Profile updated }

  /auth/avatar:
    post:
      tags: [Auth]
      summary: Upload avatar
      security:
        - BearerAuth: []
      responses:
        "200": { description: Avatar uploaded }

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend verification email
      security:
        - BearerAuth: []
      responses:
        "200": { description: Email sent }

  # ─── Projects ───
  /projects:
    get:
      tags: [Projects]
      summary: List projects
      security:
        - BearerAuth: []
      responses:
        "200": { description: Project list }
    post:
      tags: [Projects]
      summary: Create project
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                module_type: { type: string }
      responses:
        "201": { description: Project created }

  /projects/{id}:
    get:
      tags: [Projects]
      summary: Get project
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Project details }
    put:
      tags: [Projects]
      summary: Update project
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Project updated }
    delete:
      tags: [Projects]
      summary: Delete project
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Project deleted }

  # ─── Project Files ───
  /projects/{id}/files:
    get:
      tags: [Projects]
      summary: List project files
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: File list }

  /projects/{id}/files/{path}:
    get:
      tags: [Projects]
      summary: Get file content
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: File content }
    put:
      tags: [Projects]
      summary: Save file
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: File saved }
    delete:
      tags: [Projects]
      summary: Delete file
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: File deleted }

  /projects/{id}/files/upload:
    post:
      tags: [Projects]
      summary: Upload files
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Files uploaded }

  /projects/{id}/validate:
    post:
      tags: [Projects]
      summary: Validate project
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Validation result }

  # ─── Builds ───
  /projects/{id}/build:
    post:
      tags: [Build]
      summary: Create build
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Build created }

  /projects/{id}/builds:
    get:
      tags: [Build]
      summary: List builds
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Build list }

  /projects/{id}/build/auto:
    post:
      tags: [Build]
      summary: Auto-build
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Auto build started }

  /builds/{id}:
    get:
      tags: [Build]
      summary: Get build
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Build details }

  /builds/{id}/logs:
    get:
      tags: [Build]
      summary: Stream build logs
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Build logs stream }

  /builds/{id}/download:
    get:
      tags: [Build]
      summary: Download build artifact
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Build artifact }

  /builds/{id}/cancel:
    post:
      tags: [Build]
      summary: Cancel build
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Build cancelled }

  # ─── Build Schedules ───
  /projects/{id}/build-schedules:
    get:
      tags: [Build]
      summary: List build schedules
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Schedule list }
    post:
      tags: [Build]
      summary: Create build schedule
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Schedule created }

  /projects/{id}/build-schedules/{scheduleId}:
    put:
      tags: [Build]
      summary: Toggle schedule
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Schedule toggled }
    delete:
      tags: [Build]
      summary: Delete schedule
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Schedule deleted }

  # ─── Agent ───
  /agent/run:
    post:
      tags: [Agent]
      summary: Run AI Agent task
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task: { type: string, description: "Task description (max 20000 chars)" }
                session_id: { type: string }
                provider_id: { type: string }
                model: { type: string }
                project_id: { type: string }
                project_context: { type: string }
                agent_mode: { type: string, enum: [plan, act] }
      responses:
        "200":
          description: SSE stream of agent events
          content:
            text/event-stream:
              schema: { type: string }

  /agent/skills:
    get:
      tags: [Agent]
      summary: List available agent skills
      security:
        - BearerAuth: []
      responses:
        "200": { description: Skill list }

  /agent/custom-skills:
    get:
      tags: [Agent]
      summary: List custom skills
      security:
        - BearerAuth: []
      responses:
        "200": { description: Custom skill list }
    post:
      tags: [Agent]
      summary: Create custom skill
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, prompt]
              properties:
                name: { type: string }
                description: { type: string }
                prompt: { type: string }
                input_schema: { type: string }
                is_public: { type: boolean }
      responses:
        "201": { description: Skill created }

  /agent/custom-skills/{id}:
    put:
      tags: [Agent]
      summary: Update custom skill
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Skill updated }
    delete:
      tags: [Agent]
      summary: Delete custom skill
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Skill deleted }

  /agent/custom-skills/{id}/execute:
    post:
      tags: [Agent]
      summary: Execute custom skill
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input: { type: string }
      responses:
        "200": { description: Skill execution result }

  /agent/custom-skills/{id}/evolution:
    get:
      tags: [Agent]
      summary: Get skill evolution stats
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Evolution stats }
    post:
      tags: [Agent]
      summary: Record skill execution
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Execution recorded }

  /agent/custom-skills/{id}/optimize:
    get:
      tags: [Agent]
      summary: Get skill optimization suggestions
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Optimization suggestions }

  /agent/stats:
    get:
      tags: [Agent]
      summary: Get tool usage statistics
      security:
        - BearerAuth: []
      responses:
        "200": { description: Tool stats }

  /agent/audit:
    get:
      tags: [Agent]
      summary: Get audit history
      security:
        - BearerAuth: []
      parameters:
        - { name: tool, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200": { description: Audit entries }

  /agent/denials:
    get:
      tags: [Agent]
      summary: Get permission denials
      security:
        - BearerAuth: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200": { description: Denial records }

  /agent/sessions:
    get:
      tags: [Agent]
      summary: List agent sessions
      security:
        - BearerAuth: []
      responses:
        "200": { description: Session list }

  /agent/sessions/{id}:
    get:
      tags: [Agent]
      summary: Get agent session with messages
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Session details }

  /agent/session/{sessionId}:
    get:
      tags: [Agent]
      summary: Get agent session state
      security:
        - BearerAuth: []
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Session state }

  # ─── AI ───
  /ai/prompts:
    get:
      tags: [AI]
      summary: Get AI prompts
      responses:
        "200": { description: Prompt list }
    put:
      tags: [AI]
      summary: Update AI prompt
      security:
        - BearerAuth: []
      responses:
        "200": { description: Prompt updated }

  /ai/generate:
    post:
      tags: [AI]
      summary: Generate module with AI
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt: { type: string }
                language: { type: string }
      responses:
        "200": { description: Generated module }

  /ai/chat:
    post:
      tags: [AI]
      summary: Chat with AI
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string }
      responses:
        "200": { description: AI response }

  /ai/stream:
    post:
      tags: [AI]
      summary: Stream AI chat
      security:
        - BearerAuth: []
      responses:
        "200": { description: SSE stream }

  /ai/capability:
    get:
      tags: [AI]
      summary: Get AI capability score
      security:
        - BearerAuth: []
      responses:
        "200": { description: Capability score }

  /ai/history/{session_id}:
    get:
      tags: [AI]
      summary: Get AI history
      security:
        - BearerAuth: []
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: History data }
    delete:
      tags: [AI]
      summary: Delete AI history
      security:
        - BearerAuth: []
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: History deleted }

  /ai/memory:
    get:
      tags: [AI]
      summary: List AI memory
      security:
        - BearerAuth: []
      responses:
        "200": { description: Memory entries }
    delete:
      tags: [AI]
      summary: Clear all AI memory
      security:
        - BearerAuth: []
      responses:
        "200": { description: Memory cleared }

  /ai/memory/{type}/{key}:
    delete:
      tags: [AI]
      summary: Delete specific memory
      security:
        - BearerAuth: []
      parameters:
        - { name: type, in: path, required: true, schema: { type: string } }
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Memory deleted }

  /ai/conversations:
    get:
      tags: [AI]
      summary: List conversations
      security:
        - BearerAuth: []
      responses:
        "200": { description: Conversation list }
    post:
      tags: [AI]
      summary: Save conversation
      security:
        - BearerAuth: []
      responses:
        "200": { description: Conversation saved }

  /ai/conversations/{id}:
    get:
      tags: [AI]
      summary: Get conversation
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Conversation details }
    delete:
      tags: [AI]
      summary: Delete conversation
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Conversation deleted }

  /ai/sessions:
    get:
      tags: [AI]
      summary: List AI sessions
      security:
        - BearerAuth: []
      responses:
        "200": { description: Session list }

  /ai/sessions/{session_id}/messages:
    get:
      tags: [AI]
      summary: Get session messages
      security:
        - BearerAuth: []
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Message list }

  /ai/sessions/{session_id}:
    delete:
      tags: [AI]
      summary: Delete session
      security:
        - BearerAuth: []
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Session deleted }

  # ─── LLM Config ───
  /llm/config:
    get:
      tags: [LLM]
      summary: Get LLM config
      security:
        - BearerAuth: []
      responses:
        "200": { description: LLM config }
    post:
      tags: [LLM]
      summary: Update LLM config
      security:
        - BearerAuth: []
      responses:
        "200": { description: Config updated }

  /llm/providers:
    get:
      tags: [LLM]
      summary: List LLM providers
      responses:
        "200": { description: Provider list }

  /llm/provider-config:
    put:
      tags: [LLM]
      summary: Save provider config
      security:
        - BearerAuth: []
      responses:
        "200": { description: Config saved }

  /llm/provider-configs:
    get:
      tags: [LLM]
      summary: Get provider configs
      security:
        - BearerAuth: []
      responses:
        "200": { description: Config list }

  /llm/provider-config/{id}:
    delete:
      tags: [LLM]
      summary: Delete provider config
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Config deleted }

  /llm/custom-providers:
    get:
      tags: [LLM]
      summary: Get custom providers
      security:
        - BearerAuth: []
      responses:
        "200": { description: Provider list }
    post:
      tags: [LLM]
      summary: Create custom provider
      security:
        - BearerAuth: []
      responses:
        "201": { description: Provider created }

  /llm/custom-providers/{id}:
    put:
      tags: [LLM]
      summary: Update custom provider
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Provider updated }
    delete:
      tags: [LLM]
      summary: Delete custom provider
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Provider deleted }

  # ─── Templates ───
  /templates:
    get:
      tags: [Templates]
      summary: List templates
      responses:
        "200": { description: Template list }

  /templates/list:
    get:
      tags: [Templates]
      summary: List templates (detailed)
      responses:
        "200": { description: Template list }

  /templates/{name}:
    get:
      tags: [Templates]
      summary: Get template
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Template details }

  /templates/recommend:
    post:
      tags: [Templates]
      summary: Recommend templates
      responses:
        "200": { description: Recommendations }

  /templates/market:
    get:
      tags: [Templates]
      summary: List market templates
      responses:
        "200": { description: Market template list }
    post:
      tags: [Templates]
      summary: Publish template
      security:
        - BearerAuth: []
      responses:
        "201": { description: Template published }

  /templates/market/trending:
    get:
      tags: [Templates]
      summary: Get trending templates
      responses:
        "200": { description: Trending list }

  /templates/market/categories:
    get:
      tags: [Templates]
      summary: Get template categories
      responses:
        "200": { description: Category list }

  /templates/market/{id}:
    delete:
      tags: [Templates]
      summary: Delete template
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Template deleted }

  /templates/market/{id}/use:
    post:
      tags: [Templates]
      summary: Use template
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Template applied }

  # ─── Market ───
  /market/modules:
    get:
      tags: [Market]
      summary: List market modules
      responses:
        "200": { description: Module list }

  /market/trending:
    get:
      tags: [Market]
