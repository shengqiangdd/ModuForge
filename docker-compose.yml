services:
  moduforge:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: moduforge:latest
    container_name: moduforge
    restart: unless-stopped
    depends_on:
      seaweedfs:
        condition: service_started
    ports:
      - "8086:8080"
    environment:
      - PORT=:8080
      - DATABASE_PATH=/data/moduforge.db
      - BUILD_DIR=/data/builds
      - MODULES_DIR=/data/modules
      - PROJECTS_DIR=/data/projects
      - STORAGE_PATH=/data/storage
      - S3_ENDPOINT=seaweedfs:8333
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=moduforge
      - GIN_MODE=release
      # JWT_SECRET: 留空则自动生成随机密钥（重启后失效，生产环境请显式设置）
      - JWT_SECRET=${JWT_SECRET:-}
      - MODUFORGE_DEV=0
      - TZ=Asia/Shanghai
      # ADB 密钥持久化：HOME 指向 /data（moduforge_data 卷），adbkey 存到
      # /data/adbhome/.android/，容器重建后设备授权指纹不丢（否则每次重建
      # 都要重新在手机上允许 USB 调试）
      - HOME=/data/adbhome
    volumes:
      - moduforge_data:/data
      - moduforge_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    restart: unless-stopped
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # Master
      - "8081:8081"   # Volume HTTP
    command: "server -s3 -s3.port=8333 -master.port=9333 -volume.port=8081 -dir=/data -filer=false -s3.iam.config=/etc/seaweedfs/iam.json"
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs_s3.json:/etc/seaweedfs/s3.json:ro
      - ./seaweedfs_security.toml:/etc/seaweedfs/security.toml:ro
      - ./seaweedfs_iam.json:/etc/seaweedfs/iam.json:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9333/cluster/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  moduforge_data:
    driver: local
  moduforge_uploads:
    driver: local
  seaweedfs_data:
    driver: local
