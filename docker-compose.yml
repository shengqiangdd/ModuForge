services:
  moduforge:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: moduforge:latest
    container_name: moduforge
    restart: unless-stopped
    ports:
      - "8086:8080"
    environment:
      - PORT=:8080
      - DATABASE_PATH=/data/moduforge.db
      - BUILD_DIR=/data/builds
      - MODULES_DIR=/data/modules
      - PROJECTS_DIR=/data/projects
      - STORAGE_PATH=/data/storage
      - GIN_MODE=release
      # JWT_SECRET: 留空则自动生成随机密钥（重启后失效，生产环境请显式设置）
      - JWT_SECRET=${JWT_SECRET:-}
      - MODUFORGE_DEV=0
      - TZ=Asia/Shanghai
    volumes:
      - moduforge_data:/data
      - moduforge_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  moduforge_data:
    driver: local
  moduforge_uploads:
    driver: local
