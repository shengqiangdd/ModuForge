services:
  moduforge:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: moduforge:latest
    container_name: moduforge
    restart: unless-stopped
    depends_on:
      seaweedfs:
        condition: service_started
    ports:
      - "8086:8080"
    environment:
      - PORT=:8080
      - DATABASE_PATH=/data/moduforge.db
      - BUILD_DIR=/data/builds
      - MODULES_DIR=/data/modules
      - PROJECTS_DIR=/data/projects
      - STORAGE_PATH=/data/storage
      - S3_ENDPOINT=seaweedfs:8333
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=moduforge
      - GIN_MODE=release
      # JWT_SECRET: 必须显式配置（在 .env 设置），留空时登录/认证不可用（GenerateJWT 拒绝空密钥）
      - JWT_SECRET=${JWT_SECRET:-}
      - MODUFORGE_DEV=0
      - TZ=Asia/Shanghai
      # MCP (Model Context Protocol) servers: JSON array passed via env.
      # Example: MCP_SERVERS='[{"name":"github","url":"http://host:8000/mcp","headers":{"Authorization":"Bearer x"}}]'
      # or point to a file with MCP_SERVERS_FILE.
      - MCP_SERVERS=${MCP_SERVERS:-}
      - MCP_SERVERS_FILE=${MCP_SERVERS_FILE:-}
      # ADB 密钥持久化：HOME 指向 /data（moduforge_data 卷），adbkey 存到
      # /data/adbhome/.android/，容器重建后设备授权指纹不丢（否则每次重建
      # 都要重新在手机上允许 USB 调试）
      - HOME=/data/adbhome
    volumes:
      - moduforge_data:/data
      - moduforge_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  seaweedfs:
    # 固定版本 4.41（latest 当前指向 4.41，tag 便于升级与回滚）
    image: chrislusf/seaweedfs:4.41
    container_name: seaweedfs
    restart: unless-stopped
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # Master
      - "8081:8081"   # Volume HTTP
    command: "server -s3 -s3.port=8333 -master.port=9333 -volume.port=8081 -dir=/data -filer=false -s3.iam.config=/etc/seaweedfs/iam.json"
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs_s3.json:/etc/seaweedfs/s3.json:ro
      - ./seaweedfs_security.toml:/etc/seaweedfs/security.toml:ro
      - ./seaweedfs_iam.json:/etc/seaweedfs/iam.json:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9333/cluster/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # GitHub MCP Server (官方) — Streamable HTTP on :3333/mcp
  # 通过 .env 的 GITHUB_PAT 提供 Personal Access Token；MCP_SERVERS 需指向
  # http://github-mcp-server:3333/mcp
  # 注意：官方镜像是 distroless（无 shell/wget），容器内 healthcheck 无法执行，
  # 存活探测由宿主机 /usr/local/bin/moduforge-health-check.sh 完成（JSON-RPC initialize）。
  github-mcp-server:
    # 固定 digest（对应 2026-08-10 的 v1.9.0 release；ghcr 版本 tag 体系混乱，digest 最可靠）
    image: ghcr.io/github/github-mcp-server@sha256:881b53d6f75f69bdbc1b5b10fc2f1361717c19054143b3a8529fb5c32061a50e
    container_name: github-mcp-server
    restart: unless-stopped
    command: ["http", "--port", "3333"]
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PAT:-}
      - GITHUB_MCP_LOG_LEVEL=info
    ports:
      - "3333:3333"

volumes:
  moduforge_data:
    driver: local
  moduforge_uploads:
    driver: local
  seaweedfs_data:
    driver: local
